---
# CROSS-NAMESPACE binding: this RoleBinding lives in the runner namespace
# `codify-sandboxes` and grants the codify-sandbox-manager Role (also in
# `codify-sandboxes`) to the codify-server SA, which lives in the SEPARATE
# server namespace `codify`. A RoleBinding may reference a subject in another
# namespace, so the server gets runner-Pod management rights in
# `codify-sandboxes` ONLY — never in its own namespace. The subject namespace
# is set explicitly (NOT injected) so the binding is unambiguous. The runner SA
# is deliberately absent — runner Pods need no API access.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codify-sandbox-manager
  namespace: codify-sandboxes
  labels:
    app.kubernetes.io/name: codify
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codify-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: codify-server
    namespace: codify
