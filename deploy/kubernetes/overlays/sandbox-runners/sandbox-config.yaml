---
# ConfigMap supplying the server's `sandbox:` section. The managed-sandbox backend
# is read from the CODIFY_CONFIG file (not the env-based codify-config
# ConfigMap); deployment-patch.yaml mounts this at /etc/codify and points
# CODIFY_CONFIG at it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codify-sandbox-config
  namespace: codify # mounted by the server Pod
  labels:
    app.kubernetes.io/name: codify
    app.kubernetes.io/component: server
data:
  config.yaml: |
    sandbox:
      provider: kubernetes
      # URL the runner Pod's host dials back to. In-cluster service DNS (the base
      # Service listens on port 80) is simplest; use your ingress URL if runner
      # Pods must reach the server through it.
      server_url: http://codify.codify.svc.cluster.local
      # ── optional, provider-agnostic ──
      # host_config:               # verbatim in-sandbox ~/.codify/config.yaml content,
      #   providers:               # merged in before `codify host` starts — e.g. route
      #     litellm:               # the `pi` harness through a self-hosted gateway.
      #       kind: gateway        # Keep secrets out: api_key_ref: env: resolves inside
      #       default: [pi]        # the runner Pod against the secret_name Secret below.
      #       openai:
      #         base_url: http://litellm.litellm.svc.cluster.local/v1
      #         api_key_ref: env:LITELLM_API_KEY
      #         wire_api: chat
      kubernetes:
        # Runner-Pod namespace (secret_name / service_account resolve here).
        namespace: codify-sandboxes
        # Harness LLM/git creds projected into every Pod via envFrom. Created out
        # of band (see README "Apply") — separate from the per-Pod launch-token Secret.
        secret_name: codify-creds
        # ServiceAccount the runner Pods run as (deliberately powerless).
        service_account: codify-runner
        # ── all optional below ──
        # image: ghcr.io/your-org/codify-host:latest  # default: official multi-arch (amd64/arm64) host image
        # env: [PROXY_URL]           # SERVER env vars injected as literal Pod env (prefer secret_name for creds)
        # node_selector:             # extra node labels; default kubernetes.io/arch: amd64, override to arm64 to run there
        #   disktype: ssd
        # resources:                 # runner Pod sizing (defaults: 0.5-2 cpu / 1-4Gi)
        #   requests: {cpu: "500m", memory: "1Gi"}
        #   limits: {cpu: "2", memory: "4Gi"}
        # pvc_mounts:                # pre-created PVCs (in the runner namespace) mounted into every runner Pod
        #   - claim_name: codify-datasets
        #     mount_path: /mnt/datasets
        #     read_only: true        # default true; set false only for claims meant as shared scratch
        # in_cluster: true           # config source: true=in-cluster SA only, false=kubeconfig only, omit=try both
        # kubeconfig: /path/to/config  # out-of-cluster kubeconfig (env: CODIFY_KUBERNETES_KUBECONFIG)
