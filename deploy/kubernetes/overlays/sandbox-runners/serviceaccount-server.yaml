---
# RBAC for the kubernetes sandbox provider (on-demand runner Pods).
#
# TWO-NAMESPACE, LEAST-BLAST-RADIUS DESIGN: the server, its DB/PVC and its
# Secrets live in `codify`; the runner Pods live in a SEPARATE
# `codify-sandboxes` namespace. The server SA's pods create/get/delete +
# secrets create/delete rights are scoped (via a Role + RoleBinding) to
# `codify-sandboxes` ONLY — so a compromised server can manage RUNNER Pods but
# CANNOT delete the server/DB Pods, read the server's Secrets, nor (because
# there is no pods/exec grant) execute commands inside any Pod.
#
#   codify-server  — the Codify server runs as this SA (this file; lives in
#                      `codify`). deployment-patch.yaml sets
#                      serviceAccountName: codify-server. The launcher uses its
#                      in-cluster token to manage runner Pods + their token
#                      Secrets in `codify-sandboxes`.
#   codify-runner  — the runner Pods run as this SA (serviceaccount-runner.yaml,
#                      lives in `codify-sandboxes`); it has NO API rights.
#
# Role (role.yaml) + RoleBinding (rolebinding.yaml) live in `codify-sandboxes`;
# the RoleBinding subject is the codify-server SA in `codify` (a
# cross-namespace binding — see rolebinding.yaml). Scope is a namespaced Role
# (NOT a ClusterRole) so the grant can never reach beyond the runner namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codify-server
  namespace: codify
  labels:
    app.kubernetes.io/name: codify
    app.kubernetes.io/component: server
