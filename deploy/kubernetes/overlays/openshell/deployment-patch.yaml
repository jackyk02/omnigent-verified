apiVersion: apps/v1
kind: Deployment
metadata:
  name: codify
spec:
  template:
    spec:
      serviceAccountName: codify
      containers:
        - name: codify
          volumeMounts:
            - name: openshell-gateway
              mountPath: /home/codify/.config/openshell
              readOnly: true
            - name: server-config
              mountPath: /data/server-config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: openshell-gateway
          secret:
            secretName: openshell-gateway-config
            optional: true
        - name: server-config
          configMap:
            name: codify-server-config
