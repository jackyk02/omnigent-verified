apiVersion: v1
kind: ConfigMap
metadata:
  name: codify-config
  labels:
    app: codify
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ARTIFACT_DIR: "/data/artifacts"
  CODIFY_ADMIN_CREDENTIALS_PATH: "/data/admin-credentials"
  CODIFY_AUTH_ENABLED: "1"
  CODIFY_AUTH_PROVIDER: "accounts"
  CODIFY_ACCOUNTS_AUTO_OPEN: "0"
