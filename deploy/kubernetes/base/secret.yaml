apiVersion: v1
kind: Secret
metadata:
  name: codify-secrets
  labels:
    app: codify
type: Opaque
stringData:
  # Replace with your actual database connection string.
  DATABASE_URL: "postgresql+psycopg://codify:changeme@your-db-host:5432/codify"
  # Generate with: openssl rand -hex 32
  CODIFY_ACCOUNTS_COOKIE_SECRET: "changeme"
