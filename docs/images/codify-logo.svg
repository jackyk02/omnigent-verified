<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="codify logo">
  <defs>
    <linearGradient id="va-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43BA6"/>
      <stop offset="1" stop-color="#FF7ACB"/>
    </linearGradient>
  </defs>
  <!-- fan-out: one task branches into three parallel proposals -->
  <path d="M22 64 C 42 64, 46 30, 66 30" fill="none" stroke="#F43BA6" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round"/>
  <path d="M22 64 C 42 64, 46 98, 66 98" fill="none" stroke="#F43BA6" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round"/>
  <path d="M22 64 L 66 64" fill="none" stroke="url(#va-brand)" stroke-width="8" stroke-linecap="round"/>
  <!-- losing proposals: scored, not merged -->
  <circle cx="70" cy="30" r="7" fill="none" stroke="#F43BA6" stroke-opacity="0.38" stroke-width="5"/>
  <circle cx="70" cy="98" r="7" fill="none" stroke="#F43BA6" stroke-opacity="0.38" stroke-width="5"/>
  <!-- winner continues to the final verified commit -->
  <path d="M77 64 L 88 64" fill="none" stroke="url(#va-brand)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="70" cy="64" r="8" fill="#F43BA6"/>
  <circle cx="102" cy="64" r="17" fill="url(#va-brand)"/>
  <!-- verification check -->
  <path d="M94.5 64.5 L 100 70 L 110 58.5" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
